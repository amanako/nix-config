---
name: build-and-push
on:
  push:
    branches: [main, dev]
    paths:
      - modules/**
      - .github/workflows/*
      - flake.nix
      - flake.lock

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@main

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            fallback = true

      - name: Setup caches
        uses: cachix/cachix-action@v17
        with:
          name: amanako

      - name: Setup packages
        run: |
          nix --accept-flake-config profile add \
            github:juspay/omnix#default \
            github:juspay/cachix-push#default

      - name: Build flake outputs
        run: om ci run --results=om.json

      - name: Push to cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cachix-push-om-outputs -c amanako \
            --subflake ROOT \
            --prefix "$(git branch --show-current)" < om.json
