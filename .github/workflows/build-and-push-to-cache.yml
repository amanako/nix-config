---
name: build-and-push
on:
  push:
    branches: [main, dev]
    paths:
      - modules/**
      - .github/workflows/*
      - flake.nix
      - flake.lock

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@v10

      - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d

      - name: Setup caches
        uses: cachix/cachix-action@v17
        with:
          name: amanako
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build flake outputs
        run: |
          nix --accept-flake-config run .#write-flake
          nix --accept-flake-config build ".#all" \
             --print-out-paths
