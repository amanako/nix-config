---
name: build-and-push
on:
  push:
    branches: [main, dev]
    paths:
      - modules/**
      - .github/workflows/*
      - flake.nix
      - flake.lock

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@v10

      - uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d

      - name: Build flake outputs
        run: |
          nix build ".#all" \
            --accept-flake-config \
            --print-out-paths \
            --no-link \
            > /tmp/out-paths.txt

      - name: Push to cache
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix run nixpkgs#cachix -- push amanako \
            $(cat /tmp/out-paths.txt)
