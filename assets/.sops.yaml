# sops-nix configuration (https://github.com/Mic92/sops-nix)
#
# Repo-wide sops file, discovered by walking up from any secret. Secrets live
# under host/user-scoped directories, and each `creation_rules` entry restricts
# decryption to just that entity (plus you, so you can manage it):
#
#   assets/hosts/<hostname>/secrets/   -> that host + you
#   (?:assets/)?users/<username>/secrets/  -> that user + you
#
# Age public keys are derived two ways (run from the repo root):
#   - user key:   nix shell nixpkgs#age -c age-keygen -y ~/.config/sops/age/keys.txt
#   - host key:   nix shell nixpkgs#ssh-to-age -c ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#                 (or: ssh-keyscan <host> | nix shell nixpkgs#ssh-to-age -c ssh-to-age)
#
# The `path_regex` rules below tolerate an optional `assets/` prefix, so sops
# matches whether you run it from the repo root (`assets/users/...`) or from
# inside `assets/` (`users/...`).

keys:
  - &host_kusunoki age1ctptalgwuhp7cw2q0p5cr9lfnhqs8gxa96swn4laae3djzrja5zqysdpcg
  - &user_yasu age19l5w7et4mzeunr6xl33aa9yapm4n70uapljcjv7q44qf3m365seqa4yprr
  - &host_ashikaga age15ys4wwjv3rnv7zhh30l0j5e8wrw9dc8vz53r4hhglqkztfzvcycsxxwsew
  - &user_izamu age1696chm73s2vf7rk0s9w6qnup76w2pr97csjhtm48l3umztze8atqzzr9er
  - &host_kintoru age18433wrxe85apgq70y9whzrz66ahq8ac74zyuev2nrxu2v8v7ve3q4mge2k

creation_rules:
  - path_regex: hosts/kusunoki/secrets/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *host_kusunoki
          # Allow admin user access to decrypt host secrets
          - *user_yasu

  - path_regex: users/yasu/secrets/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *user_yasu

  - path_regex: hosts/ashikaga/secrets/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *host_ashikaga
          - *user_izamu
  - path_regex: users/izamu/secrets/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *user_izamu
  - path_regex: hosts/kintoru/secrets/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *host_kintoru
          - *user_yasu
