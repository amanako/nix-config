when:
  - event: cron
    cron: "bump flake" # Runs every 2 weeks (cron schedule: @every 336h)
    branch: dev
  - event: manual
    branch: dev

steps:
  - name: update-flake
    image: nixos/nix:latest
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - |
        export NIX_CONFIG=$(cat <<-EOF
        extra-experimental-features = nix-command flakes
        access-tokens = github.com=$${GITHUB_TOKEN}
        EOF
        )
      - |
        bash -o pipefail -c 'nix --accept-flake-config shell nixpkgs#just -c just fu 2>&1 | tee .flake-update-log'
        awk '/^• (Updated|Removed) input/{show=1} show && /^fetching /{exit} show' .flake-update-log > .flake-update-changes

  - name: commit-and-push
    image: alpine/git:latest
    environment:
      GIT_AUTHOR_NAME:
        from_secret: GIT_AUTHOR_NAME
      GIT_AUTHOR_EMAIL:
        from_secret: GIT_AUTHOR_EMAIL
      GITEA_TOKEN:
        from_secret: GITEA_TOKEN
      GIT_SSH_PRIVATE_KEY:
        from_secret: GIT_SSH_PRIVATE_KEY
      GIT_SSH_PUBLIC_KEY:
        from_secret: GIT_SSH_PUBLIC_KEY
    commands:
      - |
        git config --global user.name "$${GIT_AUTHOR_NAME}"
        git config --global user.email "$${GIT_AUTHOR_EMAIL}"
        git config --global gpg.format ssh
        git config --global commit.gpgsign true

      - |
        mkdir -p ~/.ssh
        echo "$${GIT_SSH_PRIVATE_KEY}" > ~/.ssh/signing_key
        echo "$${GIT_SSH_PUBLIC_KEY}" > ~/.ssh/signing_key.pub
        chmod 600 ~/.ssh/signing_key

      - |
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/signing_key

      - |
        git config --global user.signingkey "$(cat ~/.ssh/signing_key.pub)"
        git config --global gpg.ssh.allowedSignersFile ~/.ssh/allowed_signers
        echo "$(git config --global user.email) namespaces=\"git\" $(cat ~/.ssh/signing_key.pub)" > ~/.ssh/allowed_signers

      - |
        BRANCH="flake-lock-update/$(date +%F_%H-%M)"
        git checkout -b $BRANCH
        git add flake.lock

      - |
        if git diff --cached --quiet; then
          echo "flake.lock unchanged – nothing to do."
          exit 0
        fi

      - |
        git commit -S -m "chore(flake): update lock ($(date +%F))"
        git push https://x-access-token:$${GITEA_TOKEN}@codeberg.org/${CI_REPO}.git "$BRANCH"
        echo "$BRANCH" > .branch

  - name: open-pr
    image: alpine/curl:latest
    environment:
      GITEA_TOKEN:
        from_secret: GITEA_TOKEN
    commands:
      - |
        if [ ! -f .branch ]; then
          echo "no branch pushed – nothing to do."
          exit 0
        fi
        BRANCH=$(cat .branch)
        [ -f .flake-update-changes ] || : > .flake-update-changes
        CHANGES=$(sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' .flake-update-changes | awk 'BEGIN{ORS=""} {printf "%s\\n", $0}')
        curl -fsS -X POST "https://codeberg.org/api/v1/repos/${CI_REPO}/pulls" \
          -H "Authorization: token $${GITEA_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"head\":\"$BRANCH\",\"base\":\"dev\",\"title\":\"chore(flake): update lock\",\"body\":\"Automated flake.lock update, opened by Woodpecker.\\n\\nChanges to flake inputs:\\n\\n${CHANGES}\"}"
