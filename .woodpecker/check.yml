when:
  - event: pull_request
  - event: push
    branch: dev

steps:
  - name: check flake
    image: nixos/nix:latest
    commands:
      - |
        export NIX_CONFIG=$(cat <<-EOF
        extra-experimental-features = nix-command flakes
        EOF
        )
      - nix --accept-flake-config flake check -L --all-systems --show-trace
