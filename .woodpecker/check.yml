when:
  - event: push
    branch: [main, dev]

steps:
  - name: check flake
    image: nixos/nix:latest
    commands:
      - |
        export NIX_CONFIG=$(cat <<-EOF
        extra-experimental-features = nix-command flakes
        EOF
        )
      - nix profile add nixpkgs#just
      - just fwrite
      - nix --accept-flake-config flake check -L
